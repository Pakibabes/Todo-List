<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive Todo List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <p id="logo">TL</p>
    <div class="enclose">
        <div class="wrapper">
            <h1>Login</h1>
            <h3>Hi, There!</h3>
            <form>
                <input id="user" class="textBox" type="text" placeholder="Username">
                <input id="pass" class="textBox" type="password" placeholder="Password">
                <p id="error"></p>
                <button id="btnLogin">Login</button>
            </form>
            <p id="p1" class="paragraph">Don't have an account?</p>
            <p id="p2" class="paragraph">Register here</p>
        </div>
    </div>

    <script src="JavaScriptFolder/app.js"></script>
</body>
</html>
